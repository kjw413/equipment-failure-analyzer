[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["build", "dist", "sample", "output", "outputs", "tmp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tools/*.py" = ["E402"]
"tests/test_gui.py" = ["E402"]
"tests/test_pdf.py" = ["E402"]

[tool.ruff.format]
line-ending = "lf"
